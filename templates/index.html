<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="RuleBot - An intelligent rule-based AI assistant for programming, AI, computer science, and tech queries.">
    <title>RuleBot AI - Intelligent Knowledge Assistant</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app-wrapper">
        <main class="chat-container" role="main" aria-label="RuleBot Chat Interface">
            <!-- Header Section -->
            <header class="header">
                <div class="header-left">
                    <div class="bot-avatar-header" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="10" rx="2"></rect>
                            <circle cx="12" cy="5" r="2"></circle>
                            <path d="M12 7v4"></path>
                            <line x1="8" y1="16" x2="8.01" y2="16"></line>
                            <line x1="16" y1="16" x2="16.01" y2="16"></line>
                        </svg>
                    </div>
                    <div class="header-info">
                        <h1>RuleBot AI</h1>
                        <div class="status-indicator">
                            <span class="status-dot" aria-hidden="true"></span>
                            <span class="status-text">Online & Ready</span>
                        </div>
                    </div>
                </div>
                <div class="header-actions">
                    <button id="clear-btn" class="header-action-btn" title="Clear Conversation" aria-label="Clear Conversation">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 6h18"></path>
                            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
                            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
                        </svg>
                        <span>Clear</span>
                    </button>
                </div>
            </header>

            <!-- Chat Message Area -->
            <section id="chat-box" class="chat-box" aria-live="polite" aria-label="Message History">
                <!-- Welcome Bot Message -->
                <div class="message-row bot-row">
                    <div class="avatar bot-avatar" aria-hidden="true">🤖</div>
                    <div class="message-bubble-wrapper">
                        <div class="message-sender">RuleBot</div>
                        <div class="message bot-message">
                            Hello! 👋 I'm RuleBot, your rule-based AI guide for programming, AI concepts, databases, computer science, and tech basics. How can I help you today?
                        </div>
                        <span class="timestamp" id="initial-time">Just now</span>
                    </div>
                </div>

                <!-- Suggested Quick Prompts -->
                <div id="suggestions-container" class="suggestions-container" aria-label="Quick Question Suggestions">
                    <span class="suggestions-label">💡 Suggested Questions:</span>
                    <div class="chips-list">
                        <button type="button" class="chip-btn" data-query="What is Python?">🐍 What is Python?</button>
                        <button type="button" class="chip-btn" data-query="What is Machine Learning?">🤖 Machine Learning</button>
                        <button type="button" class="chip-btn" data-query="Explain Python Lists">📋 Python Lists</button>
                        <button type="button" class="chip-btn" data-query="What is SQL?">🗄️ What is SQL?</button>
                        <button type="button" class="chip-btn" data-query="Difference between AI and ML">⚡ AI vs ML</button>
                        <button type="button" class="chip-btn" data-query="What can you do?">✨ What can you do?</button>
                    </div>
                </div>

                <!-- Typing Indicator (Hidden by default) -->
                <div id="typing-indicator" class="message-row bot-row typing-row hidden" aria-hidden="true">
                    <div class="avatar bot-avatar">🤖</div>
                    <div class="message-bubble-wrapper">
                        <div class="typing-bubble">
                            <span class="dot"></span>
                            <span class="dot"></span>
                            <span class="dot"></span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Input Form Area -->
            <footer class="input-container">
                <form id="chat-form" class="chat-form" autocomplete="off">
                    <div class="input-wrapper">
                        <input
                            type="text"
                            id="user-input"
                            class="user-input"
                            placeholder="Ask RuleBot anything (e.g., What is Python?)..."
                            maxlength="300"
                            required
                            aria-label="Your message to RuleBot"
                        >
                    </div>
                    <button type="submit" id="send-btn" class="send-btn" aria-label="Send message" title="Send message">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </form>
            </footer>
        </main>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
